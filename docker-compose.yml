services:
  postgres:
    image: postgres:17
    container_name: workhub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: workhub
      POSTGRES_USER: workhub
      POSTGRES_PASSWORD: "1234"

    ports:
      - "5433:5432"

    volumes:
      - workhub_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d workhub",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: workhub-server
    restart: unless-stopped

    env_file:
      - ./server/.env

    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://workhub:workhub_password@postgres:5432/workhub

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1

    container_name: workhub-client
    restart: unless-stopped

    environment:
      NODE_ENV: production

    ports:
      - "3000:3000"

    depends_on:
      - server

volumes:
  workhub_postgres_data: